apiVersion: v1
kind: Service
metadata:
  name: {{ include "one-million-hello-world.fullname" . }}
  labels:
    app: {{ include "one-million-hello-world.name" . }}
spec:
  selector:
    app: {{ include "one-million-hello-world.name" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
