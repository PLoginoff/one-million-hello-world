# Production values for one-million-hello-world

replicaCount: 3

image:
  repository: one-million-hello-world
  tag: latest

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

config:
  NODE_ENV: production
  LOG_LEVEL: warn
  RATE_LIMIT_ENABLED: "true"
  CACHE_ENABLED: "true"

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.example.com
      paths:
        - /

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
