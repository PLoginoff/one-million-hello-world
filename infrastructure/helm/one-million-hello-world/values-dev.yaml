# Development values for one-million-hello-world

replicaCount: 1

image:
  repository: one-million-hello-world
  tag: dev

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

config:
  NODE_ENV: development
  LOG_LEVEL: debug
  RATE_LIMIT_ENABLED: "false"
  CACHE_ENABLED: "false"

ingress:
  enabled: false
