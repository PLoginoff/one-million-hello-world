apiVersion: apps/v1
kind: Deployment
metadata:
  name: one-million-hello-world
  namespace: hello-world
  labels:
    app: one-million-hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app: one-million-hello-world
  template:
    metadata:
      labels:
        app: one-million-hello-world
    spec:
      containers:
        - name: app
          image: one-million-hello-world:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
