apiVersion: v1
kind: ConfigMap
metadata:
  name: one-million-hello-world-config
  namespace: hello-world
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  RATE_LIMIT_ENABLED: "true"
  CACHE_ENABLED: "true"
  CORS_ORIGINS: "https://app.example.com"
  METRICS_ENABLED: "true"
  HEALTH_CHECK_INTERVAL_MS: "30000"
