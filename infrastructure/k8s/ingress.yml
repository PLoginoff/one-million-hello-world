apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: one-million-hello-world
  namespace: hello-world
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: hello-world.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: one-million-hello-world
                port:
                  number: 80
