version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: one-million-hello-world
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - hello-world-network

  redis:
    image: redis:7-alpine
    container_name: hello-world-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - hello-world-network

  prometheus:
    image: prom/prometheus:latest
    container_name: hello-world-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - hello-world-network

  grafana:
    image: grafana/grafana:latest
    container_name: hello-world-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - hello-world-network

networks:
  hello-world-network:
    driver: bridge
