name: Helm Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.13.0'

      - name: Package Helm chart
        run: |
          helm package infrastructure/helm/one-million-hello-world

      - name: Login to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart
        run: |
          CHART_VERSION=${GITHUB_REF#refs/tags/v}
          helm push one-million-hello-world-${CHART_VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
